# ============================================================================
# config.default.toml — the single source of truth for the spec toolkit.
#
# A different corpus is a different copy of this file (`spec --config FILE`).
# The code is one; the corpus knowledge lives here. This is what makes "the
# entity-systems spec tool" and "the core-protocol spec tool" one codebase.
#
# REFACTOR STATUS (v2, Phase 1): this file initially encodes TODAY'S per-tool
# reality byte-for-byte, so each analyzer's output stays identical when it
# switches from its own hardcoded constants to reading this file. Lines tagged
#   # DELTA(phase2)
# mark the inconsistencies the operator reconciles in Phase 2 — preserved as-is
# for now, on purpose, so Phase 1 is a provably non-breaking move.
# ============================================================================

[corpus]
# Resolved relative to the CORPUS root — the directory you point the tool at
# (`--corpus PATH`, `$SPEC_CORPUS`, else the working directory). The tool ships
# no corpus of its own, so it cannot derive one from its own location; it did
# until the repo split, and the value left behind (`docs/architecture/
# v7.0-core-revision` — a path in no post-split checkout) is what made both
# gates scan zero files. "." means the corpus root itself, which is the
# post-split layout every spec repo this tool serves shares: `specs/` at top.
repo_root = "."


# --- project vocabulary -----------------------------------------------------
# Was triplicated: type_roots in spec-style AND spec-tree; doc_families in
# spec-topology. One home now.
[vocabulary]
# Slash-path first-segments that denote ENTITY TYPES (held to the kebab naming
# rule). Everything else is a source/config/url path, not gated.
# (was spec-style TYPE_ROOTS + spec-tree TYPEPATH_RE)
type_roots = ["system", "primitive", "entity"]

# Doc-family name prefixes used to recognise a cross-document citation target.
# (was spec-topology DOC_VOCAB_EXTRA)
doc_families = [
  "PROPOSAL", "EXPLORATION", "RULING", "HANDOFF", "FEEDBACK", "REVIEW",
  "ANALYSIS", "STATUS", "PLAN", "REPORT", "SYNTHESIS", "RECONCILIATION",
  "METHODOLOGY", "CROSS", "MILESTONE", "WORKSTREAMS", "PRIMER", "DESIGN",
  "SPEC", "GUIDE", "ARCHITECTURE",
]

# Accepted values for a spec's `**Status**:` header. (was spec-standards CANONICAL_STATUS)
canonical_status = ["Draft", "Active", "Superseded", "Normative"]

# Doc-name family prefixes that denote a PROCESS / INTENT artifact (proposals,
# explorations, reviews, handoffs, status, design notes…). SPECIFICATION-FORMAT
# §11.3: a normative spec MUST NOT cite these; an arch/guide doc MAY (it's
# informational provenance). `address` uses this to classify a citation target.
intent_families = [
  "PROPOSAL", "EXPLORATION", "RULING", "HANDOFF", "FEEDBACK", "REVIEW",
  "ANALYSIS", "STATUS", "PLAN", "REPORT", "SYNTHESIS", "RECONCILIATION",
  "METHODOLOGY", "MILESTONE", "DESIGN", "SESSION", "WORKSTREAMS", "BACKLOG",
]

# Prose nicknames that stand in for a document name. SPECIFICATION-FORMAT §11.2:
# "a prose name is not a citation" — the citation is the canonical `DOC.md`. The
# `address` analyzer detects a nickname ONLY where it immediately governs a
# `§N.M` (`V7 §5.2`), never bare prose ("the V7 era", version strings). The fix
# is rewriting the spec to canonical form; this map makes detection auditable, it
# does NOT mute the finding. A value of "" marks a self/ambiguous nickname
# ("this spec", "per spec") — always judgment-tier (self vs an upstream-named doc).
[vocabulary.nicknames]
"V7" = "ENTITY-CORE-PROTOCOL"
"core protocol" = "ENTITY-CORE-PROTOCOL"
"the core protocol" = "ENTITY-CORE-PROTOCOL"
"base protocol" = "ENTITY-CORE-PROTOCOL"
"this spec" = ""
"the spec" = ""
"per spec" = ""
"this doc" = ""
"this document" = ""


# --- document classes -------------------------------------------------------
# The CONCEPT (canonical-spec / guide / arch-doc) grounds citation legitimacy
# in SPECIFICATION-FORMAT §11.3. The concrete ASSIGNMENT of files to classes is
# tool-scoping config, not a normative spec section (design §2.8). Class drives
# what a citation into it means (a guide citing a spec is fine; a spec citing a
# guide is a leak). Phase 2 populates the overrides.
[classes]
default = "canonical-spec"
# overrides: filename glob -> class. `address` uses class to ground citation
# legitimacy (§11.3): a normative spec citing an intent artifact is a leak; an
# arch/guide doc citing one is permitted provenance. Class drives DISPOSITION,
# not discovery — every doc is still scanned.
"GUIDE-*.md"               = "guide"
"MACHINE-SPEC.md"          = "guide"
"ENTITY-CORE-MACHINE-SPEC.md" = "guide"
"SPECIFICATION-FORMAT.md"  = "guide"
"STYLE-NAMING-CONVENTIONS.md" = "guide"
"ARCHITECTURE-*.md"        = "arch-doc"
"PRIMER-*.md"              = "arch-doc"
"SYSTEM-ARCHITECTURE.md"   = "arch-doc"
"SYSTEM-IDENTITY-COMPOSITION.md" = "arch-doc"
# RETIRED 2026-09-08 and moved to `docs/archive/` — a condensed restatement is the class
# SPECIFICATION-FORMAT §8.4.3 forbids authoring. The row is kept, not deleted: if the archived
# copy is ever in scope it must still class as arch-doc and never as a canonical spec.
"ENTITY-SYSTEM-REFERENCE.md" = "arch-doc"
# A domain CHARTER declares what a domain is for and which workstream owns it —
# process, not protocol. It defaulted to canonical-spec, which scored its own
# "Owning workstream" line as spec contamination.
"CHARTER.md"               = "arch-doc"
# SYSTEM-COMPOSITION stays canonical-spec (load-bearing, highly cited).


# ============================================================================
# Scope profiles. Each analyzer names a profile (below). TODAY the three corpus
# tools disagree on root AND excludes; Phase 1 preserves that exactly by giving
# them distinct profiles. Phase 2 collapses these to one reconciled scope.
#
#   namespace scope = what's LOADED so references resolve
#   analysis scope  = what we're STRICT about / cleaning
# A reference into namespace-but-not-analysis scope is external/forward, normal.
# (Phase 1 has no scope split yet; profiles below are single-root analysis sets.)
# ============================================================================

# Post-split layout: every spec repo this tool serves keeps its normative
# surface in `specs/` at the corpus root (entity-core-protocol: the V7 core +
# the two rulebooks; entity-system-architecture: the same plus extensions/,
# sdk/, applications/, domains/, with guides/ alongside). The pre-split roots
# (`core-protocol-domain/specs`) named a directory that exists in neither.

[scope.core-specs]          # spec-topology's view: the normative surface
root = "specs"
exclude_dirs = ["deprecated", "archived", "archive", "test-vectors"]
exclude_files = []

[scope.core-specs-strict]   # spec-standards' view: same, minus the rulebooks
root = "specs"
exclude_dirs = ["deprecated", "archived", "archive", "test-vectors", "reviews",
                "explorations", "proposals", "__pycache__", ".git", "node_modules"]
# The rulebooks quote their own counter-examples; never lint them.
exclude_files = ["SPECIFICATION-FORMAT.md", "STYLE-NAMING-CONVENTIONS.md", "BACKLOG.md"]

[scope.published-narrative]  # the OTHER published surface: docs that publish
# `spec standards --scope published-narrative`. The five narrative rules only
# (see NARRATIVE_RULES in standards.py); the structural rules are meaningless
# over a proposal and would bury the signal.
#
# Why this scope exists. `core-specs-strict` above excludes `proposals`,
# `explorations` and `reviews`, and its neighbour `naming-surface` states the
# reasoning outright: *"proposals and explorations are drafts by definition."*
# That was true, and it stopped being true when this corpus declared
# `[[keep_tree]]` over `docs/proposals` and `docs/research/explorations` — they
# are product now, they reach a reader outside the ecosystem, and the rules that
# exist to keep process narrative out of a stranger's document had never read
# one of them. Measured 2026-09-07: operator quotations in 18, seat names in 106,
# internal discipline-letter references in 93.
#
# `reviews/` is NOT here, deliberately: it is undeclared and does not publish.
# The scope tracks the publication declaration, not the directory's shape — that
# is the whole correction, so keep the two in step when CANONICAL-DOCS moves.
#
# CANONICAL-DOCS moved, 2026-09-08: DISCIPLINE-CHARTER is undeclared. Its entry
# below used to be an EXCEPTION — excluded on rulebook grounds, *a rulebook quotes
# its own counter-examples* — which was defensible and was also exactly how the
# leak stayed invisible. It is now excluded BY THE RULE: an undeclared file is out
# of a published-narrative scope by construction. The entry stays because this
# list is a name filter and the file still sits under `docs/`, but it no longer
# rests on a judgment call. Same for DESIGN-REGISTER, ANTI-PATTERN-CASEBOOK,
# COHORT-OPEN-ITEMS and LEGACY-ARCHIVE-INDEX — none of those is declared either,
# so every name below is now redundant-with-the-declaration rather than an
# override of it. **If one of them is ever declared, delete its line here** —
# do not let a name filter quietly outrank the keep-list.
root = "docs"
exclude_dirs = ["status", "archive", "archived", "deprecated", "reviews",
                "__pycache__", ".git", "node_modules"]
exclude_files = ["DESIGN-REGISTER.md", "COHORT-OPEN-ITEMS.md",
                 "DISCIPLINE-CHARTER.md", "ANTI-PATTERN-CASEBOOK.md",
                 "LEGACY-ARCHIVE-INDEX.md", "STATUS.md",
                 "DOCTRINE-COHORT-STATE-TRACKING.md"]

[scope.test-vector-corpus]  # spec-corpus's view: the ARTIFACTS, not the prose
# The one scope that reaches INTO test-vectors. Every other scope excludes it,
# which is why the corpus was not merely unlinted but UNREACHABLE: a
# version-stamped directory name, a seven-week SEEDS.md gap, and a `.diag`
# carrying 58-byte Ed448 seeds beside a correct `.cbor` all sat outside every
# analyzer by construction. The prose scopes still exclude it, and should — a
# `.diag` is not a spec and must not be graded as one.
root = "specs/test-vectors"
exclude_dirs = ["deprecated", "archived", "archive", "__pycache__", ".git"]
exclude_files = []

[scope.addressing-analysis]   # whose OWN citations `address` grades
# The published surface, which is `specs/` AND `guides/` — not `specs/` alone.
#
# `address` rooted at `specs/` for its whole life, so all 34 guides were graded
# by nothing: they were loaded into `addressing-namespace` as citation TARGETS
# (so a spec citing a guide resolved) and never scanned as citation SOURCES. The
# asymmetry is invisible from the output — a scope that is never read reports the
# same zero findings as a scope that is clean — and it is where a stale
# networking status board and two dangling proposal citations survived.
#
# §11 governs the guides by its own terms: §11.3 row 2 makes an architectural /
# guide document a legitimate citation target, and `_dispose_external` already
# reads the SOURCE class, so a guide citing an intent artifact is permitted
# provenance rather than a leak. What it still catches in a guide is the class
# that matters there: a citation to a document absent from the whole corpus.
#
# Agent guidance, community-health files and the changelog share this root and
# are excluded by name: they are neither spec nor guide, §11 does not govern
# them, and grading them would bury the corpus findings in noise.
root = "."
exclude_dirs = ["deprecated", "archived", "archive", "test-vectors", "docs",
                "reviews", "proposals", "explorations", "research", "status",
                "__pycache__", ".git", ".github", "node_modules"]
exclude_files = ["AGENTS.md", "AGENTS-STANDARD.md", "AGENTS.local.md",
                 "CLAUDE.md", "CLAUDE.local.md", "METHODOLOGY.md", "README.md",
                 "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
                 "SECURITY.md", "GOVERNANCE.md", "SUPPORT.md"]

[scope.addressing-namespace]  # what citation targets RESOLVE against (wide)
# Every real doc in the corpus — so `address` can tell a TRUE dangling (no file
# anywhere) from a citation into a doc that simply sits outside the analysis
# scope (a proposal/exploration/guide). Resolution scope ⊋ analysis.
root = "."
exclude_dirs = ["deprecated", "archived", "archive", "__pycache__", ".git", "node_modules"]
exclude_files = []

[scope.naming-surface]      # spec-style's view: every doc with normative type-paths
# Wider than `specs/` on purpose — the naming standard governs any doc carrying
# normative type-paths, so guides/ and the root roadmaps are in. Intent and
# ephemeral material is out: proposals and explorations are drafts by
# definition, and dated status/handoff docs are snapshots that are immutable
# once published (they cannot be corrected, so gating them is a permanent red).
root = "."
exclude_dirs = ["deprecated", "archived", "archive", "test-vectors",
                "reviews", "proposals", "explorations", "research", "status",
                "__pycache__", ".git", "node_modules"]
exclude_files = ["STYLE-NAMING-CONVENTIONS.md"]
# DELTA(phase2): naming-surface still roots wider than standards/topology. That
# split is intentional (above) and no longer a pre-split accident; what remains
# for phase 2 is expressing it through document CLASSES rather than dir names.


# ============================================================================
# Analyzer bindings + policy.
# Principle #3: analyzers emit observations; VERDICTS live here. "error" gates
# (non-zero exit); "warn"/"info" report. The same observation is an error in one
# config and expected in another, with no analyzer code change.
# ============================================================================

[analyzer.topology]
scope = "core-specs"
# Unresolved ("dangling") citations are OBSERVATIONS, not errors by default.
# A core spec citing a downstream extension for narrative clarity is normal.
unresolved_ref = "info"     # DELTA(phase2): tune once namespace/analysis split lands

[analyzer.standards]
scope = "core-specs-strict"
# Severity per rule (was spec-standards RULES). "error" gates.
[analyzer.standards.rules]
header-version-missing   = "error"
header-version-blob      = "error"
header-status-missing    = "error"
header-status-unknown    = "warn"
title-not-h1             = "error"
depends-missing          = "error"
document-history-section = "warn"
date-in-body             = "warn"
impl-team-ref            = "warn"
proposal-citation        = "warn"
amendment-provenance     = "warn"
hash-width-pin           = "error"

# ============================================================================
# PROVENANCE — `spec provenance`. The L1 gate: no normative spec edit without a
# proposal. Reads CHANGES, not text, which is why it is its own analyzer and not
# a standards rule: "was there a proposal for this edit?" is unanswerable from
# the file alone.
#
# Severity is `warn` on purpose. Flipping to error retroactively fails against
# the 34-commit backlog on contact and is off within a day; ratchet it once the
# reconstruction ledger burns down. Same play as the five standards rules.
# ============================================================================
[analyzer.provenance]
default_since = "HEAD~1"
spec_prefix = "specs/"
# State is the directory (INDEX.md §0), so proposal existence is a listing.
proposal_dirs = ["docs/proposals"]

# Declared, greppable exemptions. Both are arch's own standing rules, and both
# must be CLAIMED in a commit trailer rather than inferred by the tool: an
# exemption nobody can audit is not an exemption. Without `cohort-finding`,
# trigger 2 fires on every in-place fix.
#   Spec-Change: hygiene          wording-only; no normative change
#   Spec-Change: cohort-finding   impl finding fixed in place, no rev bump
carve_outs = ["hygiene", "cohort-finding"]

[analyzer.provenance.rules]
normative-edit-without-proposal = "warn"
# An informative document under `specs/` (an ARCHITECTURE-*, a navigation doc, a
# rulebook) whose version moved without its normative-token count moving. It is
# reported so the change stays visible, at `info`, because L1 is about normative
# spec edits and an arch-doc is where rationale is SUPPOSED to live. A
# normative-token change in the same file is still the normative finding.
informative-doc-revision        = "info"
# A claimed exemption the gate does not recognise is a different fact from no
# exemption at all, and is reported as its own rule rather than folded in.
spec-change-trailer-unknown     = "warn"

# ============================================================================
# LEDGER — `spec ledger`. Declared counts in tracking docs vs the directories
# they name. Not scope-based: it names DOCUMENTS, because what is checked is
# one file's claim about its own siblings, not a surface to sweep.
#
# `docs/` sits outside every prose scope on purpose (proposals are drafts;
# dated status docs are immutable snapshots that cannot be corrected).
# An `INDEX.md` is the exception that proves it: it says of itself *"Update on
# every state change"*, so an index is the one kind of document in `docs/`
# whose drift is a defect rather than a fossil.
#
# `docs/research/INDEX.md` was added for the same reason `docs/proposals/`
# has one. The design record — explorations and reviews — had a README
# describing the *lifecycle* and nothing describing the *inventory*, so the
# only way to answer "what have we already studied about X" was grep, and
# grep finds only the words you already guessed. Work was repeatedly redone
# because the document that had already done it could not be found. An index
# without a gate becomes wrong within a cycle, so it gets this rung too.
# ============================================================================
[analyzer.charter]
# The discipline set is written in two homes and neither says it is a copy of
# the other, so a divergence is invisible from both. Paths are resolved against
# the corpus root; a repo carrying neither has nothing to gate (exit 2).
charter_doc = "docs/DISCIPLINE-CHARTER.md"
agents_doc = "AGENTS.md"

[analyzer.charter.rules]
# A rule RATIFIED in one home and CANDIDATE in the other. The ladder makes the
# distinction load-bearing: a candidate is honored but never claimed to
# generalize, so the two homes disagree about what may be asserted.
charter-status-divergence = "error"
# Present in one home, absent from the other. The twelve-day shape: the summary
# grew nine rules and the canonical table did not, so the document that answers
# "what is the set?" was short and said so with no hedge.
charter-rule-missing = "error"

[analyzer.ledger]
# Resolved against the corpus root. A repo carrying none of these has nothing
# to gate, which is reported as could-not-look (exit 2), never as a pass.
# Listing a document a repo does not carry is safe: absent files are skipped,
# and only a total absence of all of them is the could-not-look case.
documents = ["docs/proposals/INDEX.md", "docs/research/INDEX.md"]

[analyzer.ledger.rules]
declared-count-mismatch = "error"
# A declaration naming a directory that does not exist is the `unscanned reads
# as zero` shape: rename the directory and the pattern stops matching, so the
# count silently stops being guarded while the run stays green.
declared-count-dangling = "error"
# A proposal whose own `Status:` says the edit landed while it sits in
# `active/`. The count rules cannot see this — both totals agree, because
# the file is still there and still counted. `active/` means work is owed,
# so a folded proposal left there inflates the backlog with work already
# done. A hold is DECLARED (partial / stays active / until the cohort),
# never inferred: L3 requires a partial fold to stay active.
proposal-state-mismatch = "error"
# The cheap rung under the rule above. `warn`, not `error`: it does not detect a
# defect, it detects an unageable claim — and the burn-down is a handful of files
# rather than a sweep, so it should be visible without gating a push. Promote to
# error once the count reaches zero and the habit is "a status carries a date".
proposal-undated-status = "warn"

# Heading-parenthetical abbreviations -> the subdirectory each stands for, as in
# `## 1. Active — 25 files (ext 14 · app 5 · process 6 · core 0)`. Corpus
# knowledge, so it lives here; an unrecognised token is skipped, never guessed.
[analyzer.ledger.aliases]
ext = "extensions"
app = "applications"
apps = "applications"
extensions = "extensions"
applications = "applications"
process = "process"
core = "core"

[analyzer.corpus]
scope = "test-vector-corpus"
# The corpus gate. Its rules are the mechanism for defects that were each found
# by an implementation, never by review, and each recorded in the corpus's own
# SEEDS.md as owed: *"worth a build-time assertion rather than a reader's
# diligence"* (the F16 width sweep) and *"if the two `.cbor` shas ever differ
# after this, that is the defect, and it is worth a check"* (the two-copy
# invariant). This is that assertion and that check.
#
# NOTE (TOML): scalars first, sub-tables last. Every key after a
# `[analyzer.corpus.<sub>}` header belongs to that sub-table, not to this one.

# Placeholder text that must never survive into an artifact. F16: the corpus
# sha-locked and was declared Phase-2 LOCKED over twelve of the first one.
placeholders = ["TBD-COHORT-ROUND-TRIP", "TBD-", "PENDING", "FIXME", "XXX-"]

# Nouns a corpus directory and its artifacts must agree on. Catches an artifact
# filed under the wrong corpus: `v767/conformance-vectors-v1.*` is the AGILITY
# corpus wearing the CONFORMANCE corpus's filename, two directories from the
# real `ecf-conformance/conformance-vectors-v1.*`.
corpus_words = ["agility", "conformance", "type-registry", "compute"]

# Below this, a repeated byte is ordinary data rather than a fixture. The
# fixtures guarded here are 32/57/64 bytes wide.
min_fixture_run = 8

[analyzer.corpus.rules]
corpus-version-stamp   = "error"
corpus-name-mismatch   = "error"
corpus-pair-incomplete = "error"
corpus-placeholder     = "error"
corpus-fixture-width   = "error"
corpus-pair-disagree   = "error"
vendor-drift           = "error"
vendor-ambiguous       = "error"
vendor-unmatched       = "warn"

# Declared fixture widths: fill byte -> bytes. These are `agility-SEEDS.md` §2's
# own declarations, moved out of prose and into the mechanism. Ed448 secret
# seeds are 57 per RFC 8032 §5.2 (`0x42`, `0x46`); Ed25519 seeds are 32
# (`0x43`/`0x44`/`0x45`/`0x47`); the `experimental-test` fixture public key is
# `0xAA` × 64 per v7.66 §4.2. Six literals across the two `.diag` files carried
# 58/58/63 for seven weeks while both `.cbor` artifacts carried 57/57/64.
[analyzer.corpus.fixture_widths]
0x42 = 57
0x43 = 32
0x44 = 32
0x45 = 32
0x46 = 57
0x47 = 32
0xAA = 64

# --- [analyzer.corpus] scalars live ABOVE its sub-tables; see the NOTE there --

# ============================================================================
# MATURITY / CONVERGENCE  —  `spec convergence`
#
# The pipeline is this project's standard sequence: a spec lands, the core
# reference peers implement it, the generators produce peers from it, and
# eventually something outside the project uses it. Arch measures the FIRST
# stage and only the first stage. Every later stage is owned by the repo that
# does the work, reports its own state, and is aggregated here — never asserted
# here. That split is why `source` is a path a repo publishes rather than
# something this tool computes.
#
# Stages are DATA so the sequence can grow (a second generator, a new language
# family, a community register) without a code change. A stage with no source
# reports `unreported`, which is deliberately different from being absent: the
# column stays visible so the hole is legible.
# ============================================================================

[maturity]
scope = "naming-surface"   # what counts as "a spec" for rate-of-change purposes
window_days = 90           # commit-count window
active_days = 14           # changed within this -> volatile
settle_days = 60           # unchanged beyond this -> settling

# The trajectory flag the canonical maturity doc sets by hand. Derived here from
# the commit dates instead, because a hand-set flag is one more number that goes
# stale silently — the defect the whole maturity proposal is about.

[[maturity.stages]]
name = "spec"
owner = "architecture"
# measured here, from git

[[maturity.stages]]
name = "core-reference-peers"
owner = "entity-core-{go,rust,py}"
# source = "…"  # a convergence report each impl publishes; none yet

[[maturity.stages]]
name = "generators"
owner = "entity-core-keystone (+ the system generator, not live)"
# source = "…"  # the generated-peer census; keystone publishes per-peer reports
                # today but in no agreed shape — see the oracle-contract §4
                # verdict-document work, which this depends on.

[[maturity.stages]]
name = "community"
owner = "outside this project"
# source = "…"  # NOT "an implementation exists" — specs confirmed in USAGE.
                # Currently zero, and published as zero rather than omitted:
                # a cohort all passing one author's vectors is cohort-consistent,
                # not independent convergence (AGENTS-STANDARD).

[analyzer.style]
scope = "naming-surface"
# PASS separator-styles per naming axis; "off" = report-only (was AXIS_POLICY).
# An axis whose value list does not include the token's style is a violation
# (gates). SINGLE always passes. Encoding/hash prefixes are exempt.
[analyzer.style.axes]
type-path  = ["kebab"]          # namespace -> kebab; snake/mixed = real violation
value      = ["snake", "kebab"] # error-code(snake) or enum(kebab); only mixed fails
field      = "off"              # token-followed-by-':' heuristic too coarse to gate (v0.3)
other-path = "off"
pseudo-fn  = "off"
bare       = "off"


# ============================================================================
# REPORT / OUTPUT POLICY  —  Phase 2, NOT YET WIRED (sketch for review).
#
# Discovery (everything above) finds EVERYTHING. The report layer decides what
# to SURFACE. Acknowledged findings are suppressed here — like linter rule
# exclusions / a baseline — so a known, reviewed, documented issue stops
# harassing every run WITHOUT being hidden from discovery (it's still found,
# still counted, still shown under --show-suppressed).
#
# This keeps two concerns cleanly separate:
#   what IS the corpus / what to analyze     (stable, structural)   -> above
#   what have I acknowledged / how to render (grows as you triage)  -> here
# A suppressions list MAY instead live in a sibling file (--suppressions FILE);
# same-file / distinct-section is the default.
# ============================================================================

[report]
format = "md"            # md | json
max_examples = 5         # per rule, before "... +N more"

# Baseline: each entry marks matching observations as acknowledged -> suppressed
# from the default report. Append as you triage; give a reason so it's auditable.
#
# Worked example — the rulebook counter-example problem, solved cleanly: instead
# of HARD-EXCLUDING SPECIFICATION-FORMAT from the corpus (which blinds topology
# to its real citations), keep it discovered and SUPPRESS its expected findings
# here. This retires the meta-spec exclude DELTA: discovery converges (every tool
# sees every file), report diverges (acknowledged noise stays quiet).
#
# [[report.suppress]]
# rule   = "type-path"
# path   = "SPECIFICATION-FORMAT.md"
# reason = "the rulebook quotes non-conforming forms to define the rule"
#
# [[report.suppress]]
# rule   = "*"
# path   = "STYLE-NAMING-CONVENTIONS.md"
# reason = "the style guide's own counter-example fixtures"

# ============================================================================
# census — the corpus against its consumers.
#
# Every other analyzer reads a document against a rule. This one reads the
# normative surface against the `§`-citations the implementations write back
# into their own source: 27,498 of them across five seats on first run, a map
# of what the cohort believes it is implementing, which no arch instrument had
# ever opened.
#
# Seats are resolved against the corpus root's PARENT — the polyrepo checkout.
# A seat that is not present is NAMED in the run header and never silently
# dropped: an unscanned tree and a clean tree produce byte-identical output,
# and an absence measured against the wrong checkout is a defect this
# ecosystem has already nearly published.
# ============================================================================
[analyzer.census]
# Sibling repos whose specs/ and guides/ are part of the obligation surface.
# Without this every `V7 §4.6` in cohort source reports as an orphan citation —
# could-not-look wearing a verdict's clothes, which is the exact failure the
# `address` analyzer's `--namespace-root` flag exists to prevent.
namespace_roots = ["../entity-core-protocol"]

# How the cohort spells a document in source. `V7` is the whole cohort's name
# for the core protocol spec and accounts for ~1,000 citations in one seat; an
# alias is the honest way to carry that, because the alternative is a large
# bucket reported as unattributable.
[analyzer.census.aliases]
V7 = "ENTITY-CORE-PROTOCOL"
"ENTITY-CORE-PROTOCOL" = "ENTITY-CORE-PROTOCOL"
# The cohort's short name for `ENTITY-NATIVE-TYPE-SYSTEM`. It is not derivable:
# the bare-alias rule strips `EXTENSION-`/`GUIDE-`/`SDK-`/`APP-CONVENTION-`
# prefixes, and this document has none of them.
"TYPE-SYSTEM" = "ENTITY-NATIVE-TYPE-SYSTEM"
"NATIVE-TYPE-SYSTEM" = "ENTITY-NATIVE-TYPE-SYSTEM"
"CBOR-ENCODING" = "ENTITY-CBOR-ENCODING"

[analyzer.census.rules]
# A seat cites a section this corpus does not have. `address` finds this for
# documents citing documents; this finds it for CODE citing documents, which
# is the direction that reaches an implementer working from a stale reading.
orphan-citation = "error"
# The section's newest line is newer than the last commit touching the file
# that cites it: the spec moved and the implementation has not been opened
# since. `--drift` only.
spec-moved-under = "error"
# Normative tokens, cited by product code, gated by no oracle check. The FM-1
# class — §4.7 declares ten MUST-emit rows and roughly one is driven.
unobserved-must = "warn"
# Normative tokens and no citation anywhere. Deliberately not an error: plenty
# of correct code cites nothing. It is a reading list, ordered by MUST density.
uncited-section = "warn"

[analyzer.census.seats.entity-core-go]
path = "entity-core-go"
source = ["*.go"]
skip = ["/vendor/", "/.git/"]
# The conformance oracle inside this seat. The product/oracle split is the
# whole point: a section cited only by product code is implemented-and-ungated,
# which is a different and more urgent state than uncited.
oracle_paths = ["cmd/internal/validate/"]

[analyzer.census.seats.entity-core-rust]
path = "entity-core-rust"
source = ["*.rs"]
skip = ["/target/", "/.git/"]
oracle_paths = ["conformance/", "tests/conformance"]

[analyzer.census.seats.entity-core-py]
path = "entity-core-py"
source = ["*.py"]
skip = ["/.venv/", "/.git/", "__pycache__"]
oracle_paths = ["conformance/", "tests/conformance"]

[analyzer.census.seats.entity-browser-rust]
path = "entity-browser-rust"
source = ["*.rs"]
skip = ["/target/", "/.git/"]
oracle_paths = ["tools/e2e/"]

[analyzer.census.seats.entity-workbench-go]
path = "entity-workbench-go"
source = ["*.go"]
skip = ["/vendor/", "/.git/"]
oracle_paths = ["tools/e2e/"]

# ---------------------------------------------------------------------------
# vocab — the application tier's TYPE VOCABULARY join.
#
# `seats` is DELIBERATELY not restated here: it falls back to
# [analyzer.census.seats] so there is one config home for "where the trees
# are". Two copies would drift, and the drift would be invisible — both
# analyzers would go on reporting cleanly about different sets of trees.
#
# `app_seats` is the subset that implements L5 conventions. Add a seat here
# the day it starts emitting `app/*` tags; a seat named but absent on disk is
# reported as COULD-NOT-LOOK and named, never silently dropped.
[analyzer.vocab]
app_seats = ["entity-browser-rust", "entity-workbench-go"]

[analyzer.roster]
# A spec's version is declared once (the header, source of truth) and copied
# into the living roadmaps and the tier standards' members tables. Neither end
# says it is a copy, so the drift is invisible from both — `charter`'s defect,
# one tier down. First run: 13 of 33 rows stale.
#
# `SYSTEM-ARCHITECTURE.md` added 2026-09-14 and it is a THIRD roster shape: the
# tier classification puts the maturity word and the version together in cell 2
# (`| `EXTENSION-TREE` | Draft v4.9 | …`) where the members-table shape expects
# them in cell 3. Adding the filename alone would have gated NOTHING and
# reported clean — which is why the shape went with it. Measured before the
# fix: 13 of 22 rows stale by up to eleven minor revisions, four extensions
# absent from the document entirely while three of the four cite it by number
# as the authority for their own tier, and one landed extension described as an
# early sketch. It was the only version roster in the corpus no gate read.
rosters = [
  "ROADMAP-EXTENSIONS.md",
  "ROADMAP-SDK.md",
  "ROADMAP-APPLICATIONS.md",
  "guides/GUIDE-APPLICATION-DEVELOPMENT.md",
  "specs/SYSTEM-ARCHITECTURE.md",
]
spec_dirs = ["specs"]

[analyzer.roster.rules]
# The roster disagrees with the header. The header wins; fix the roster. Never
# the other way round — a roster row is not evidence about a spec.
roster-version-drift = "error"
# The row names a stem that resolves to no file. After a rename a pattern gate
# silently stops matching and every count stays green, which is why this is its
# own rule rather than a skip.
roster-unknown-spec = "error"
